<style>
:root{--bg:#12151a;--panel:#1b2028;--ink:#e8e6df;--mute:#9aa1ab;--line:#2c333e;--g:#3d8f4f;--b:#6b5a7e;--acc:#c9a959}
@media (prefers-color-scheme: light){:root{--bg:#f3f1ea;--panel:#fff;--ink:#1d2127;--mute:#5d6570;--line:#d9d5c8;--acc:#8a6d1c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1180px;margin:0 auto;padding:24px 16px 64px}
header h1{margin:.2em 0 .1em;font-size:2rem}header p{margin:.2em 0;color:var(--mute);max-width:70ch}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0 28px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px}
.stat b{display:block;font-size:1.5rem}.stat span{color:var(--mute);font-size:.85rem}
.curve{display:flex;align-items:flex-end;gap:10px;height:120px;margin:6px 0}.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;width:34px;font-size:.8rem}
.bar span{display:block;width:100%;background:var(--g);border-radius:4px 4px 0 0}.bar b{order:-1}.bar i{font-style:normal;color:var(--mute)}
h2{margin:40px 0 4px;font-size:1.5rem;border-bottom:2px solid var(--acc);padding-bottom:4px}h3{margin:22px 0 10px;font-size:1.05rem;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}h3 small{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:0 8px;margin-left:6px}
.sub{margin:4px 0;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card button{all:unset;cursor:zoom-in;display:block}.card button:focus-visible{outline:3px solid var(--acc)}
.card img{display:block;width:100%;height:auto;aspect-ratio:5/7;object-fit:cover;object-position:top}
figcaption{padding:8px 10px 10px;font-size:.85rem;display:flex;flex-direction:column;gap:3px}figcaption b{font-size:.9rem}figcaption em{color:var(--mute);font-style:normal}
.cost{display:flex;gap:2px}.s{font-style:normal;width:18px;height:18px;border-radius:50%;font-size:.65rem;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:#8b8f96}
.s.hg,.s.hb,.s.hrw,.s.hwu{font-size:.5rem}.s.r{background:#b8472f}.s.u{background:#2f6fb0}.s.w{background:#a89a6a}.s.hrw{background:linear-gradient(90deg,#b8472f 50%,#a89a6a 50%)}.s.hwu{background:linear-gradient(90deg,#a89a6a 50%,#2f6fb0 50%)}.s.g{background:#2f7a43}.s.b{background:#4a3f58}.s.hg{background:linear-gradient(90deg,#b8472f 50%,#2f7a43 50%)}.s.hb{background:linear-gradient(90deg,#b8472f 50%,#4a3f58 50%)}
.lands{display:flex;flex-wrap:wrap;gap:14px;align-items:stretch}.landbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;min-width:170px}
.landbox b{font-size:1.6rem;display:block}.landbox span{color:var(--mute);font-size:.85rem}
.land-card{width:170px}
dialog{border:0;padding:0;background:transparent;max-width:min(92vw,560px)}dialog::backdrop{background:rgba(0,0,0,.78)}
dialog img{display:block;width:100%;height:auto;max-height:92vh;object-fit:contain;border-radius:12px}
.note{margin-top:36px;color:var(--mute);font-size:.9rem;max-width:75ch}
.tabs{display:flex;gap:6px;margin:18px 0 6px;border-bottom:1px solid var(--line)}.tabs button{font:inherit;font-weight:600;color:var(--mute);background:none;border:0;border-bottom:3px solid transparent;padding:10px 18px;cursor:pointer}.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--acc)}.tabs button:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}.panel[hidden]{display:none}.intro{color:var(--mute);max-width:70ch}.dl{margin:14px 0 0}.dl a{color:var(--acc);font-weight:600}.dl span{color:var(--mute);font-size:.9rem}.h2s{font-size:1.2rem;border:0;margin-top:30px}.owners{margin-top:18px;border-bottom:2px solid var(--line)}.owners button{font-size:1.2rem;padding:10px 28px}.owner[hidden]{display:none}.tabs.decks{flex-wrap:wrap;margin-top:12px}.empty{color:var(--mute);margin:32px 0}header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px}.imgmode{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.imgmode [role=radiogroup]{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--panel)}.imgmode button{font:inherit;font-size:.85rem;font-weight:600;color:var(--mute);background:none;border:0;padding:6px 14px;cursor:pointer}.imgmode button[aria-checked=true]{background:var(--acc);color:var(--bg)}.imgmode button:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}#imgstatus{color:var(--mute);font-size:.8rem}.legal{margin-top:48px;color:var(--mute);font-size:.8rem}.legal a{color:inherit}.find{margin:18px 0 0}.find input{font:inherit;width:min(100%,420px);padding:9px 14px;border:1px solid var(--line);border-radius:99px;background:var(--panel);color:var(--ink)}.find input:focus-visible{outline:3px solid var(--acc)}.found{color:var(--mute);font-size:.85rem;margin-left:8px}figure[hidden]{display:none}.sortl{color:var(--mute);font-size:.9rem;margin-right:6px}.sortl select,.dir{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:99px;background:var(--panel);color:var(--ink)}.dir{cursor:pointer;font-weight:600;margin-right:10px}.find{display:flex;flex-wrap:wrap;gap:10px 6px;align-items:center}.meta{color:var(--acc);font-size:.8rem;font-weight:600}.meta:empty{display:none}.sortnote{min-height:1.4em}</style>
